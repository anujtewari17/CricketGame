<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  background:#0f0f1e;font-family:'DM Mono',monospace;color:#f8f4ec;
  display:flex;align-items:center;justify-content:center;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 10% 8%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 28% 4%,rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 55% 14%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 80% 7%,rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 93% 20%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 18% 35%,rgba(255,255,255,.25) 0%,transparent 100%),
    radial-gradient(1px 1px at 68% 28%,rgba(255,255,255,.2) 0%,transparent 100%);
}

/* ── SHELL ── */
#app{
  position:relative;
  width:min(480px,100vw);
  height:100dvh;
  display:flex;flex-direction:column;
  padding:12px 14px 10px;
  gap:8px;
}

/* ── HEADER ROW ── */
#header{
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
#title{
  font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:6px;
  color:#f0c040;text-shadow:0 0 30px rgba(240,192,64,.3);line-height:1;
}
#phase-banner{
  font-size:.55rem;letter-spacing:2.5px;text-transform:uppercase;
  padding:4px 10px;border-radius:20px;
  border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.4);
  transition:all .4s;line-height:1.4;
}
#phase-banner.batting{color:#f0c040;border-color:rgba(240,192,64,.4);background:rgba(240,192,64,.07);}
#phase-banner.bowling{color:#5dade2;border-color:rgba(93,173,226,.4);background:rgba(93,173,226,.07);}
#new-match-btn{
  font-family:'Bebas Neue',sans-serif;font-size:.75rem;letter-spacing:2px;
  padding:4px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.15);
  background:transparent;color:rgba(255,255,255,.4);cursor:pointer;
  transition:color .2s,border-color .2s;
}
#new-match-btn:hover{color:white;border-color:rgba(255,255,255,.4);}

/* ── SCOREBOARD ── */
#scoreboard{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
  border-radius:12px;padding:8px 14px;
}
.sb-group{display:flex;flex-direction:column;align-items:center;}
.sb-label{font-size:.52rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:1px;}
.sb-val{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;color:#f0c040;line-height:1;}
.sb-val.sm{font-size:1.3rem;color:rgba(255,255,255,.55);}
.sb-div{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:rgba(255,255,255,.1);}
#over-info{font-size:.52rem;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.28);text-align:right;}

/* ── FORM + PRESSURE STRIP ── */
#status-strip{
  flex-shrink:0;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
  border-radius:10px;padding:7px 12px;
  display:flex;flex-direction:column;gap:5px;
}
#status-row1{display:flex;align-items:center;justify-content:space-between;}
#form-name{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;transition:color .5s;}
#status-tags{display:flex;gap:6px;}
.stag{font-size:.5rem;letter-spacing:1.5px;text-transform:uppercase;padding:2px 7px;border-radius:8px;border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.35);}
#status-row2{display:flex;gap:8px;align-items:center;}
.bar-wrap{flex:1;height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width .5s,background .5s;}
#form-bar-fill{background:#5dade2;}
#pressure-label{font-size:.5rem;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.3);white-space:nowrap;}
#pressure-desc{font-size:.5rem;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;}

/* ── SCORE BAR ── */
#score-bar{
  flex-shrink:0;display:flex;align-items:center;gap:6px;
}
.sb-side{
  flex:1;display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:8px;padding:5px 10px;
}
#sb-cpu{justify-content:flex-end;}
.sb-name{font-size:.45rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.28);}
.sb-score{font-family:'Bebas Neue',sans-serif;font-size:1.05rem;color:rgba(255,255,255,.4);letter-spacing:1px;}
.sb-score.active{color:#f0c040;}
#sb-center{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px;}
#rr-row{
  flex-shrink:0;display:none;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
  border-radius:8px;padding:4px 12px;
  flex-direction:row;align-items:center;justify-content:space-around;
}
#rr-row.show{display:flex;}
.rr-chip{display:flex;gap:5px;align-items:baseline;}
.rr-label{font-size:.42rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.25);}
.rr-val{font-family:'Bebas Neue',sans-serif;font-size:.9rem;letter-spacing:1px;}
.rr-val.crr{color:rgba(255,255,255,.55);}
.rr-val.rrr-ok{color:#58d68d;}
.rr-val.rrr-warn{color:#e67e22;}
.rr-val.rrr-high{color:#e74c3c;}
#rr-need{font-size:.48rem;letter-spacing:.5px;color:rgba(255,255,255,.3);text-align:center;}

/* ── PITCH ── */
#pitch-area{
  flex:1;min-height:0;
  position:relative;border-radius:12px;overflow:hidden;
  background:#2d5a27;border:1px solid rgba(255,255,255,.06);
}
#pitch-area::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent,transparent 24px,rgba(0,0,0,.06) 24px,rgba(0,0,0,.06) 48px);
}
#pitch-strip{
  position:absolute;left:50%;transform:translateX(-50%);
  top:16px;bottom:16px;width:64px;
  background:linear-gradient(180deg,#c8a96e,#b8945e);
  border-radius:3px;border:1px solid rgba(0,0,0,.2);
}
#pitch-strip::before,#pitch-strip::after{
  content:'';position:absolute;left:-8px;right:-8px;height:2px;background:white;opacity:.7;
}
#pitch-strip::before{top:18px;}#pitch-strip::after{bottom:18px;}

#field-overlay{position:absolute;inset:0;pointer-events:none;z-index:5;}
.fdot{
  position:absolute;width:10px;height:10px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.35);
  transition:background .3s,border-color .3s;
}
.fdot.on{background:rgba(88,214,141,.38);border-color:#58d68d;}
.fdot.flash{animation:pf .5s ease;}
@keyframes pf{50%{transform:translate(-50%,-50%) scale(2.2);background:rgba(88,214,141,.85);}}

.wk-grp{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:flex-end;}
#wk-bat{bottom:22px;}#wk-bowl{top:22px;}
.stump{width:4px;height:20px;background:#e8dcc8;border-radius:1px;transition:transform .35s,opacity .35s;position:relative;}
.stump.fallen{transform:rotate(55deg) translateX(7px);opacity:.4;}
.bail-bar{position:absolute;top:-3px;left:-2px;right:-2px;height:3px;background:#e8dcc8;border-radius:1px;}

#bat-el{
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  width:12px;height:46px;background:linear-gradient(180deg,#d4a853,#c8943d);
  border-radius:2px 2px 4px 4px;transform-origin:bottom center;
  transition:transform .18s ease-out;z-index:9;
}
#bat-el.swing{transform:translateX(-50%) rotate(-85deg);}
#ball-el{
  position:absolute;width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#e84040,#c0392b);
  box-shadow:0 2px 8px rgba(0,0,0,.5);z-index:10;display:none;transition:none;
  will-change:transform,opacity;
}
#shot-pop{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:'Bebas Neue',sans-serif;font-size:3.2rem;color:#f0c040;
  text-shadow:0 0 20px rgba(240,192,64,.9);
  opacity:0;pointer-events:none;z-index:20;
}
#shot-pop.show{animation:pop 1.2s ease-out forwards;}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}
  18%{opacity:1;transform:translate(-50%,-62%) scale(1.2);}
  60%{opacity:1;transform:translate(-50%,-68%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-82%) scale(.9);}
}

/* ── BOWL TAG ── */
#bowl-tag{
  flex-shrink:0;
  font-size:.55rem;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.3);text-align:center;min-height:16px;
}

/* ── FREE HIT BADGE ── */
#freehit-badge{
  flex-shrink:0;
  display:none;
  font-size:.6rem;letter-spacing:2px;text-transform:uppercase;
  padding:4px 14px;border-radius:20px;text-align:center;
  background:rgba(46,204,113,.18);color:#2ecc71;border:1px solid rgba(46,204,113,.5);
}
#freehit-badge.show{display:block;}

/* ── SHOT / BOWL BUTTONS ── */
#shot-grid{
  flex-shrink:0;
  display:grid;grid-template-columns:repeat(4,1fr);gap:7px;
}
#bowl-grid{
  flex-shrink:0;
  display:grid;grid-template-columns:repeat(3,1fr);gap:7px;display:none;
}
.shot-btn,.bowl-btn{
  border-radius:10px;padding:10px 4px;cursor:pointer;text-align:center;
  color:#f8f4ec;transition:background .15s,border-color .15s,transform .1s;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.05);
}
.shot-btn:hover:not(:disabled){background:rgba(240,192,64,.1);border-color:rgba(240,192,64,.35);transform:translateY(-1px);}
.bowl-btn:hover:not(:disabled){background:rgba(93,173,226,.12);border-color:rgba(93,173,226,.4);transform:translateY(-1px);}
.shot-btn:active:not(:disabled),.bowl-btn:active:not(:disabled){transform:scale(.97);}
.shot-btn:disabled,.bowl-btn:disabled{opacity:.2;cursor:not-allowed;}
.btn-label{font-size:.52rem;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.35);}
.btn-range{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:#f0c040;line-height:1;}
.bowl-btn .btn-range{color:#5dade2;font-size:1rem;}
.btn-risk{
  font-size:.55rem;font-weight:600;letter-spacing:.5px;
  padding:2px 5px;border-radius:4px;margin-top:2px;
  background:rgba(0,0,0,.25);
}
.risk-safe{color:#58d68d;}
.risk-warn{color:#e67e22;}
.risk-danger{color:#e74c3c;}
.risk-extreme{color:#ff4dff;}
/* remove old pip styles */

/* ── COMMENTARY ── */
#commentary{
  flex-shrink:0;
  background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.06);
  border-radius:10px;padding:8px 12px;
  font-size:.62rem;color:rgba(255,255,255,.45);letter-spacing:.3px;line-height:1.5;
}
#comm-text{display:block;margin-bottom:5px;}
.ball-log{display:flex;flex-wrap:wrap;gap:4px;}
.bc{font-family:'Bebas Neue',sans-serif;font-size:.8rem;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.1);}
.bc-0{background:rgba(192,57,43,.2);color:#e74c3c;}
.bc-1{background:rgba(255,255,255,.06);color:#aaa;}
.bc-2{background:rgba(52,152,219,.15);color:#5dade2;}
.bc-3{background:rgba(46,204,113,.15);color:#58d68d;}
.bc-4{background:rgba(240,192,64,.18);color:#f0c040;}
.bc-6{background:rgba(240,192,64,.32);color:#f0c040;border-color:#f0c040;}
.bc-W{background:rgba(192,57,43,.4);color:#ff6b6b;border-color:#e74c3c;}
.bc-sep{width:auto;border-radius:0;border:none;border-left:1px solid rgba(255,255,255,.12);height:22px;margin:0 1px;}
.bc-Wd{background:rgba(46,204,113,.18);color:#2ecc71;border-color:rgba(46,204,113,.4);width:auto;padding:0 5px;border-radius:6px;}
.bc-Nb{background:rgba(230,126,34,.2);color:#e67e22;border-color:rgba(230,126,34,.5);width:auto;padding:0 5px;border-radius:6px;}

/* ── OVERLAYS ── */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(10,10,20,.93);backdrop-filter:blur(14px);z-index:90;
  flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:24px;
}
.overlay.show{display:flex;}
.ov-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.5rem,9vw,4rem);color:#f0c040;letter-spacing:6px;}
.ov-title.loss{color:#e74c3c;}
.ov-sub{font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);}
.ov-score{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.4rem,5vw,2.2rem);color:rgba(255,255,255,.75);}
.ov-btn{
  font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:4px;
  padding:12px 36px;border-radius:10px;border:none;cursor:pointer;
  background:#f0c040;color:#0f0f1e;box-shadow:0 4px 20px rgba(240,192,64,.4);margin-top:4px;
}

/* ── VISUAL DRAMA ── */
@keyframes particle-fly {
  0%   { transform:translate(0,0) scale(1); opacity:1; }
  100% { transform:translate(var(--dx),var(--dy)) scale(0); opacity:0; }
}
.particle {
  position:absolute;border-radius:50%;pointer-events:none;z-index:30;
  animation:particle-fly .8s ease-out forwards;
}

@keyframes screenshake {
  0%,100%{transform:translateX(0);}
  15%{transform:translateX(-7px) translateY(3px);}
  30%{transform:translateX(6px) translateY(-3px);}
  45%{transform:translateX(-5px) translateY(2px);}
  60%{transform:translateX(4px) translateY(-1px);}
  75%{transform:translateX(-2px);}
}
#app.shake{animation:screenshake .45s ease-out;}

@keyframes rope-four {
  0%,100%{box-shadow:inset 0 0 0 0 transparent;}
  40%{box-shadow:inset 0 0 0 4px #f0c040,0 0 22px rgba(240,192,64,.55);}
}
@keyframes rope-six {
  0%,100%{box-shadow:inset 0 0 0 0 transparent;}
  25%,65%{box-shadow:inset 0 0 0 5px #fff,0 0 34px rgba(255,255,255,.75);}
}
#pitch-area.flash-four{animation:rope-four .55s ease;}
#pitch-area.flash-six{animation:rope-six .65s ease;}

#streak-banner{
  position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
  font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:4px;
  color:#f0c040;text-shadow:0 0 24px rgba(240,192,64,.9);
  opacity:0;pointer-events:none;z-index:26;text-align:center;white-space:nowrap;
}
#streak-banner.show{animation:streak-pop 1.9s ease-out forwards;}
@keyframes streak-pop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.6);}
  18%{opacity:1;transform:translate(-50%,-58%) scale(1.15);}
  65%{opacity:1;transform:translate(-50%,-58%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-70%) scale(.9);}
}

#momentum-arrow{
  font-size:.7rem;transition:color .6s,transform .6s;
  flex-shrink:0;opacity:.6;
}
.mom-neutral{color:rgba(255,255,255,.2);}
.mom-you{color:#f0c040;transform:scale(1.3);}
.mom-cpu{color:#5dade2;transform:scale(1.3);}

/* ── SETUP OVERLAY ── */
#setup-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(10,10,20,.96);backdrop-filter:blur(16px);z-index:100;
  flex-direction:column;align-items:center;justify-content:center;
  gap:16px;text-align:center;padding:24px;
}
#setup-overlay.show{display:flex;}
#setup-overlay .ov-title{margin-bottom:0;}
#setup-overlay .ov-sub{margin-top:-8px;}
#overs-row{display:flex;gap:10px;justify-content:center;margin:4px 0;}
.ov-sel-btn{
  font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:3px;
  padding:10px 22px;border-radius:20px;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid rgba(240,192,64,.25);
  color:rgba(255,255,255,.5);transition:all .2s;
}
.ov-sel-btn:hover{background:rgba(240,192,64,.12);border-color:rgba(240,192,64,.5);color:#f0c040;}
.ov-sel-btn.active{background:rgba(240,192,64,.18);border-color:#f0c040;color:#f0c040;box-shadow:0 0 14px rgba(240,192,64,.25);}
#toss-btn{
  font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:4px;
  padding:12px 36px;border-radius:10px;border:none;cursor:pointer;
  background:#f0c040;color:#0f0f1e;box-shadow:0 4px 20px rgba(240,192,64,.4);
}
#toss-result{
  font-size:.7rem;letter-spacing:2px;color:rgba(255,255,255,.55);
  min-height:18px;text-transform:uppercase;
}
#toss-coin{
  font-size:2.8rem;transition:transform .4s;
}
#play-btn{
  display:none;
  font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:4px;
  padding:12px 36px;border-radius:10px;border:none;cursor:pointer;
  background:#f0c040;color:#0f0f1e;box-shadow:0 4px 20px rgba(240,192,64,.4);
}
</style>

<body>

<!-- SETUP OVERLAY -->
<div id="setup-overlay" class="show">
  <div class="ov-title">Cricket</div>
  <div class="ov-sub">Choose match length</div>
  <div id="overs-row">
    <button class="ov-sel-btn active" data-overs="2" onclick="selectOvers(2)">2</button>
    <button class="ov-sel-btn" data-overs="5" onclick="selectOvers(5)">5</button>
  </div>
  <div id="toss-coin">🪙</div>
  <div id="toss-result"></div>
  <button id="toss-btn" onclick="doToss()">Flip Coin 🪙</button>
  <button id="play-btn" onclick="startMatch()">Let's Play →</button>
</div>

<!-- INNINGS BREAK -->
<div id="innings-overlay" class="overlay">
  <div class="ov-title">Break</div>
  <div class="ov-sub" id="io-sub">Your innings is over</div>
  <div class="ov-score" id="io-score"></div>
  <div class="ov-sub" id="io-msg"></div>
  <button class="ov-btn" id="io-btn" onclick="startSecondInnings()">Now You Bowl →</button>
</div>

<!-- GAME OVER -->
<div id="gameover" class="overlay">
  <div class="ov-title" id="go-title">Match Over</div>
  <div class="ov-score" id="go-scores"></div>
  <div class="ov-sub" id="go-detail"></div>
  <button class="ov-btn" onclick="initGame()">New Match</button>
</div>

<div id="app">

  <!-- HEADER -->
  <div id="header">
    <div id="title">Cricket</div>
    <div id="phase-banner" class="batting">1st Inn · You Bat</div>
    <button id="new-match-btn" onclick="initGame()">New</button>
  </div>

  <!-- SCOREBOARD -->
  <div id="scoreboard">
    <div class="sb-group">
      <div class="sb-label">Runs</div>
      <div class="sb-val" id="sb-runs">0</div>
    </div>
    <div class="sb-div">/</div>
    <div class="sb-group">
      <div class="sb-label">Wkts</div>
      <div class="sb-val" id="sb-wkts">0</div>
    </div>
    <div class="sb-div">·</div>
    <div class="sb-group">
      <div class="sb-label">Target</div>
      <div class="sb-val sm" id="sb-target">–</div>
    </div>
    <div class="sb-div">·</div>
    <div class="sb-group">
      <div class="sb-label">Need</div>
      <div class="sb-val sm" id="sb-need">–</div>
    </div>
    <div class="sb-div">·</div>
    <div class="sb-group" style="align-items:flex-end">
      <div id="over-info">Ov <span id="sb-over">1</span>.<span id="sb-ball">0</span></div>
      <div id="sb-left" style="font-size:.48rem;letter-spacing:1px;color:rgba(255,255,255,.25);text-transform:uppercase;">5 left</div>
    </div>
  </div>

  <!-- FORM + PRESSURE -->
  <div id="status-strip">
    <div id="status-row1">
      <span id="form-name" style="color:#5dade2">❄ Cold</span>
      <div id="status-tags">
        <span class="stag" id="fe-risk">W: base</span>
        <span class="stag" id="fe-bound">4s: base</span>
        <span class="stag" id="fe-sit">Comfortable</span>
      </div>
    </div>
    <div id="status-row2">
      <span style="font-size:.48rem;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.28)">Form</span>
      <div class="bar-wrap"><div class="bar-fill" id="form-bar-fill" style="width:0%"></div></div>
      <span id="pressure-label" style="font-size:.48rem;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.28)">Pressure</span>

      <span id="pressure-desc" style="color:#58d68d;font-size:.48rem;letter-spacing:1px;text-transform:uppercase"></span>
    </div>
  </div>

  <!-- SCORE BAR -->
  <div id="score-bar">
    <div class="sb-side" id="sb-you">
      <span class="sb-name">YOU</span>
      <span class="sb-score active" id="mc-you">batting</span>
    </div>
    <div id="sb-center">
      <div id="momentum-arrow" class="mom-neutral">◆</div>
      <div id="rr-need"></div>
    </div>
    <div class="sb-side" id="sb-cpu">
      <span class="sb-score" id="mc-cpu">–</span>
      <span class="sb-name">CPU</span>
    </div>
  </div>
  <div id="rr-row">
    <div class="rr-chip"><div class="rr-label">CRR</div><div class="rr-val crr" id="rr-crr">–</div></div>
    <div class="rr-chip"><div class="rr-label">RRR</div><div class="rr-val rrr-ok" id="rr-rrr">–</div></div>
  </div>

  <!-- PITCH -->
  <div id="pitch-area">
    <div id="pitch-strip"></div>
    <div id="field-overlay"></div>
    <div class="wk-grp" id="wk-bat">
      <div style="position:relative"><div class="stump" id="st-b1"></div><div class="bail-bar"></div></div>
      <div class="stump" id="st-b2"></div>
      <div class="stump" id="st-b3"></div>
    </div>
    <div class="wk-grp" id="wk-bowl">
      <div class="stump" id="st-w1"></div>
      <div class="stump" id="st-w2"></div>
      <div class="stump" id="st-w3"></div>
    </div>
    <div id="bat-el"></div>
    <div id="ball-el"></div>
    <div id="shot-pop"></div>
    <div id="streak-banner"></div>
  </div>

  <!-- BOWL TAG -->
  <div id="bowl-tag"></div>

  <!-- FREE HIT BADGE -->
  <div id="freehit-badge">🔓 FREE HIT</div>

  <!-- SHOT / BOWL GRIDS -->
  <div id="shot-grid"></div>
  <div id="bowl-grid"></div>

  <!-- COMMENTARY -->
  <div id="commentary">
    <span id="comm-text">Choose match length and flip the coin!</span>
    <div class="ball-log" id="ball-log"></div>
  </div>

</div>

<script>
const MAX_WICKETS=10;

// Extras per-delivery probabilities
const DELIVERY_WIDE  ={pace:.05,swing:.14,spin:.04,yorker:.07,bouncer:.22,slow:.06};
const DELIVERY_NOBALL={pace:.08,swing:.05,spin:.03,yorker:.17,bouncer:.06,slow:.03};

const FORM_LEVELS=[
  {name:'❄ Cold',     col:'#5dade2',wMult:0.92,bBoost:0.90,xp:0, xpNext:4  },
  {name:'Settling',   col:'#58d68d',wMult:0.80,bBoost:1.05,xp:4, xpNext:12 },
  {name:'Set',        col:'#f0c040',wMult:0.65,bBoost:1.25,xp:12,xpNext:24 },
  {name:'In Form',    col:'#e67e22',wMult:0.50,bBoost:1.50,xp:24,xpNext:40 },
  {name:'🔥 On Fire', col:'#e74c3c',wMult:0.35,bBoost:1.80,xp:40,xpNext:999},
];

const SHOTS=[
  {id:'block',label:'Block',range:'0–1', bW:.04, p:[.32,.46,.14,.06,.01,.01], risk:1, reward:1},
  {id:'drive',label:'Drive',range:'1–4', bW:.10, p:[.06,.24,.30,.18,.14,.04], risk:2, reward:2},
  {id:'four', label:'Four', range:'4',   bW:.20, p:[.04,.06,.09,.07,.60,.10], risk:3, reward:4},
  {id:'six',  label:'Six',  range:'6',   bW:.38, p:[.03,.03,.04,.03,.12,.72], risk:5, reward:5},
];

const BOWL_TYPES=[
  {id:'pace',   label:'Pace',   desc:'Fast',        wM:1.10,bdM:.92},
  {id:'swing',  label:'Swing',  desc:'Swing',       wM:1.15,bdM:.88},
  {id:'spin',   label:'Spin',   desc:'Spin',        wM:1.05,bdM:.96},
  {id:'yorker', label:'Yorker', desc:'Full',        wM:1.20,bdM:.82},
  {id:'bouncer',label:'Bouncer',desc:'Short',       wM:1.00,bdM:1.06},
  {id:'slow',   label:'Slow',   desc:'Change-up',   wM:0.88,bdM:1.06},
];
const BOWL_FIELD={
  pace:['slip','gully','cover'],swing:['slip','3rdman','cover'],
  spin:['sqleg','midwkt','deep'],yorker:['finleg','midoff','longon'],
  bouncer:['slip','gully','3rdman'],slow:['midwkt','longon','longoff'],
};
const ALL_ZONES=[
  {id:'slip',x:63,y:18},{id:'gully',x:73,y:32},{id:'cover',x:73,y:68},
  {id:'midoff',x:59,y:82},{id:'midwkt',x:29,y:68},{id:'sqleg',x:21,y:50},
  {id:'finleg',x:27,y:82},{id:'longon',x:42,y:92},{id:'longoff',x:61,y:92},
  {id:'3rdman',x:81,y:18},{id:'deep',x:19,y:30},{id:'point',x:79,y:50},
];
const COMM={
  W:["Bowled! Stumps shattered!","Caught at slip.","LBW! Plumb in front!","Edged behind!","Clean bowled!","Caught in the deep!"],
  0:["Blocked — dot ball.","Back to the bowler.","Fielder swoops — no run.","Solid defense."],
  1:["Nudged for one.","Quick single!","Pushed — one run."],
  2:["Driven for two!","Back for two — good running!"],
  3:["Three! Great running!","Lofted — three!"],
  4:["FOUR! Through the covers!","FOUR! Brilliant drive!","FOUR! Cracked through point!","FOUR! To the boundary!"],
  6:["SIX! Over long-on!","SIX! Straight — gone!","SIX! Over mid-wicket!","SIX! Massive!","SIX! The crowd erupts!"],
  cW:["Wicket! Well bowled.","Caught! Great delivery.","Bowled 'em!","LBW — upheld!"],
  c0:["Defended — dot.","Played back.","Fielder — no run."],
};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function rollRuns(p){const v=[0,1,2,3,4,6],r=Math.random();let c=0;for(let i=0;i<p.length;i++){c+=p[i];if(r<c)return v[i];}return 0;}

let matchOvers,playerBatsFirst;
let phase,pRuns,pWkts,pBall,pOver,cRuns,cWkts,cBall,cOver,cpuTarget,animating,formXP,formLevel,dots;
let freehit,cpuFreehit;
let consecutiveSixes=0;      // resets on any non-six outcome (inc wicket)
let cpuConsecutiveSixes=0;   // same tracker for CPU
let oversScalar=1;           // set at match start based on overs
const $=id=>document.getElementById(id);

/* ── SETUP / TOSS ── */
let selectedOvers=2;

function selectOvers(n){
  selectedOvers=n;
  document.querySelectorAll('.ov-sel-btn').forEach(b=>{
    b.classList.toggle('active',parseInt(b.dataset.overs)===n);
  });
}

function doToss(){
  const coin=Math.random()<.5;// true=player wins
  const playerWins=coin;
  playerBatsFirst=playerWins;
  matchOvers=selectedOvers;
  // animate coin
  $('toss-coin').style.transform='rotateY(720deg) scale(1.3)';
  setTimeout(()=>{$('toss-coin').style.transform='';},400);
  const side=coin?'Heads':'Tails';
  const batFirst=playerWins?'You bat first':'CPU bats first';
  $('toss-result').textContent=`${side} — ${batFirst}`;
  $('toss-btn').style.display='none';
  $('play-btn').style.display='block';
}

function initGame(){
  // Show setup overlay, reset toss state
  selectedOvers=2;
  document.querySelectorAll('.ov-sel-btn').forEach(b=>{
    b.classList.toggle('active',parseInt(b.dataset.overs)===2);
  });
  $('toss-result').textContent='';
  $('toss-coin').textContent='🪙';
  $('toss-coin').style.transform='';
  $('toss-btn').style.display='block';
  $('play-btn').style.display='none';
  $('setup-overlay').classList.add('show');
  $('innings-overlay').classList.remove('show');
  $('gameover').classList.remove('show');
}

function startMatch(){
  $('setup-overlay').classList.remove('show');
  matchOvers=selectedOvers;
  oversScalar = matchOvers===2 ? 0.65 : 1.0;
  consecutiveSixes=0;
  cpuConsecutiveSixes=0;
  phase=playerBatsFirst?'batting':'bowling';
  pRuns=0;pWkts=0;pBall=0;pOver=1;
  cRuns=0;cWkts=0;cBall=0;cOver=1;cpuConsecutiveSixes=0;
  cpuTarget=null;animating=false;
  freehit=false;cpuFreehit=false;
  formXP=0;formLevel=0;dots=0;
  sixStreak=0;wicketStreak=0;momentumLog=[];
  $('pitch-area').style.background='';
  $('momentum-arrow').className='mom-neutral';
  $('mc-you').textContent=playerBatsFirst?'batting':'bowling';
  $('mc-you').className='sb-score active';
  $('mc-cpu').textContent=playerBatsFirst?'–':'batting';
  $('mc-cpu').className=playerBatsFirst?'sb-score':'sb-score active';
  $('ball-log').innerHTML='';$('bowl-tag').textContent='';
  $('sb-target').textContent='–';$('sb-need').textContent='–';
  $('status-strip').style.display=playerBatsFirst?'':'none';
  $('freehit-badge').classList.remove('show');
  resetStumps();buildFieldDots();buildShotGrid();buildBowlGrid();
  $('rr-row').classList.remove('show');
  if(playerBatsFirst){
    $('shot-grid').style.display='grid';$('bowl-grid').style.display='none';
    setBanner('batting','1st Inn · You Bat');
    updateDisplay(0,0,1,0);updateFormUI();updateSituationUI();
    $('comm-text').textContent=`You bat first — ${matchOvers} overs. Build form, then go big.`;
  }else{
    $('shot-grid').style.display='none';$('bowl-grid').style.display='grid';
    setBanner('bowling','1st Inn · You Bowl');
    updateDisplay(0,0,1,0);
    $('comm-text').textContent=`CPU bats first — ${matchOvers} overs. Keep them low!`;
    $('bowl-tag').textContent='';
    ALL_ZONES.forEach(z=>$('fd-'+z.id)?.classList.remove('on'));
  }
}

// FORM
function addFormXP(runs){
  if(runs===0){dots++;if(formLevel<2&&dots>=3)formXP=Math.max(FORM_LEVELS[formLevel].xp,formXP-1);}
  else{dots=0;formXP+=runs>=6?8:runs>=4?5:runs>=2?2:1;}
  while(formLevel<4&&formXP>=FORM_LEVELS[formLevel].xpNext)formLevel++;
  updateFormUI();
}
function resetForm(){formXP=0;formLevel=0;dots=0;updateFormUI();}
function updateFormUI(){
  const fl=FORM_LEVELS[formLevel];
  const pct=formLevel===4?100:Math.min(100,((formXP-fl.xp)/(fl.xpNext-fl.xp))*100);
  $('form-name').textContent=fl.name;$('form-name').style.color=fl.col;
  $('form-bar-fill').style.width=pct+'%';$('form-bar-fill').style.background=fl.col;
  const wm=Math.round((1-fl.wMult)*100),bm=Math.round((fl.bBoost-1)*100);
  $('fe-risk').textContent=`W: ${wm>=0?'+':''}${wm}%`;
  $('fe-risk').style.color=wm<0?'#58d68d':wm>0?'#e74c3c':'rgba(255,255,255,.35)';
  $('fe-bound').textContent=`4s: ${bm>=0?'+':''}${bm}%`;
  $('fe-bound').style.color=bm>0?'#58d68d':bm<0?'#e74c3c':'rgba(255,255,255,.35)';
}

// PRESSURE
function calcPressure(){
  if(phase!=='batting')return 0;
  const ballsLeft=matchOvers*6-(pOver-1)*6-pBall;
  if(ballsLeft<=0)return 1;
  const needed=(cpuTarget||Math.round(matchOvers*7))-pRuns;
  const rpb=needed/ballsLeft;
  const wf=pWkts>=8?.3:pWkts>=6?.15:0;
  const fo=pOver>=matchOvers?.15:0;
  return Math.min(1,Math.max(0,(rpb-.8)/1.5)+wf+fo);
}
function updateSituationUI(){
  const p=calcPressure();
  $('pressure-fill').style.width=(p*100)+'%';
  const col=p<.25?'#58d68d':p<.5?'#f0c040':p<.75?'#e67e22':'#e74c3c';
  const desc=p<.25?'Comfortable':p<.5?'Building':p<.75?'Pressure':'⚡ Critical';
  $('pressure-fill').style.background=col;
  $('pressure-desc').textContent=desc;$('pressure-desc').style.color=col;
  $('fe-sit').textContent=desc;$('fe-sit').style.color=col;
  updatePitchMood(p);
}

/* ── RUN RATE ── */
function updateRunRate(){
  const rrRow=$('rr-row');
  // Determine which team is batting and what phase we're in
  const isSecondInnings=cpuTarget!==null;
  if(!isSecondInnings){rrRow.classList.remove('show');return;}
  rrRow.classList.add('show');

  let battingRuns,battingOver,battingBall,target;
  if(phase==='batting'){
    // Player chasing (player bats 2nd, CPU batted 1st, or player bats 2nd in normal order)
    battingRuns=pRuns;battingOver=pOver;battingBall=pBall;target=cpuTarget;
  }else{
    // CPU chasing (CPU bats 2nd — when player bats first then bowls)
    battingRuns=cRuns;battingOver=cOver;battingBall=cBall;target=cpuTarget;
  }
  const oversPlayed=(battingOver-1)+battingBall/6;
  const crr=oversPlayed>0?battingRuns/oversPlayed:null;
  const totalBalls=matchOvers*6;
  const ballsBowled=(battingOver-1)*6+battingBall;
  const ballsLeft=totalBalls-ballsBowled;
  const runsNeeded=Math.max(0,target-battingRuns);
  const rrr=ballsLeft>0?(runsNeeded/(ballsLeft/6)):null;

  $('rr-crr').textContent=crr!==null?crr.toFixed(2):'–';
  if(rrr!==null){
    const rrrVal=Math.min(99.9,rrr);
    $('rr-rrr').textContent=rrrVal.toFixed(2);
    const crrNum=crr||0;
    const cls=rrrVal<crrNum+1?'rrr-ok':rrrVal<crrNum+3?'rrr-warn':'rrr-high';
    $('rr-rrr').className='rr-val '+cls;
    $('rr-need').textContent=`Need ${runsNeeded} off ${ballsLeft}b`;
  }else{
    $('rr-rrr').textContent='–';
    $('rr-rrr').className='rr-val rrr-ok';
    $('rr-need').textContent='';
  }
}

// SHOT GRID
function buildShotGrid(){
  const g=$('shot-grid');g.innerHTML='';
  SHOTS.forEach(s=>{
    const fl=FORM_LEVELS[formLevel];
    const pressure=calcPressure();
    let bW=s.bW*oversScalar*fl.wMult;
    if(consecutiveSixes>0){
      const perSix=matchOvers===2?0.06:0.10;
      bW+=consecutiveSixes*perSix;
    }
    if(pressure>.5) bW+=pressure*.04;
    bW=Math.min(bW,.75);
    const pct=Math.round(bW*100);
    const riskCls=pct<15?'risk-safe':pct<30?'risk-warn':pct<50?'risk-danger':'risk-extreme';
    const btn=document.createElement('button');
    btn.className='shot-btn';
    btn.innerHTML=`<span class="btn-label">${s.label}</span><span class="btn-range">${s.range}</span><span class="btn-risk ${riskCls}">${pct}% out</span>`;
    btn.onclick=()=>playShot(s);
    g.appendChild(btn);
  });
}
function setShotBtns(on){$('shot-grid').querySelectorAll('.shot-btn').forEach(b=>b.disabled=!on);}

// BOWL GRID
function buildBowlGrid(){
  const g=$('bowl-grid');g.innerHTML='';
  BOWL_TYPES.forEach(bt=>{
    const btn=document.createElement('button');
    btn.className='bowl-btn';
    btn.innerHTML=`<span class="btn-label">${bt.label}</span><span class="btn-range">${bt.desc}</span>`;
    btn.onclick=()=>bowlToCPU(bt);
    g.appendChild(btn);
  });
}
function setBowlBtns(on){$('bowl-grid').querySelectorAll('.bowl-btn').forEach(b=>b.disabled=!on);}

// FIELDING
function buildFieldDots(){
  const fo=$('field-overlay');fo.innerHTML='';
  ALL_ZONES.forEach(z=>{const d=document.createElement('div');d.className='fdot';d.id='fd-'+z.id;d.style.left=z.x+'%';d.style.top=z.y+'%';fo.appendChild(d);});
}
function setField(bid){ALL_ZONES.forEach(z=>$('fd-'+z.id)?.classList.remove('on'));(BOWL_FIELD[bid]||[]).forEach(z=>$('fd-'+z)?.classList.add('on'));}
function flashField(bid){const z=BOWL_FIELD[bid]||[];if(z.length){const d=$('fd-'+pick(z));if(d){d.classList.remove('flash');void d.offsetWidth;d.classList.add('flash');}}}

/* ── EXTRAS CHIP ── */
function addExtraChip(type){
  const d=document.createElement('div');
  d.className=`bc bc-${type}`;d.textContent=type;
  $('ball-log').appendChild(d);
}

/* ── BATTING (player bats) ── */
function playShot(shot){
  if(animating||phase!=='batting')return;
  animating=true;setShotBtns(false);
  const bt=pick(BOWL_TYPES);
  setField(bt.id);
  $('bowl-tag').textContent=`${bt.label} · ${bt.desc}`;

  // Check for wide (if no freehit already active)
  if(!freehit){
    if(Math.random()<.06){
      // Wide — +1 run, ball not counted
      pRuns+=1;
      $('comm-text').textContent=`${pOver}.${pBall} · ${bt.label} · WIDE — ball strays off`;
      addExtraChip('Wd');
      updateDisplay(pRuns,pWkts,pOver,pBall);
      updateRunRate();
      animating=false;
      setShotBtns(true);
      return;
    }
    if(Math.random()<.04){
      // No-ball — +1 run penalty, player still plays shot, bW=0
      pRuns+=1;
      freehit=true;
      $('freehit-badge').classList.add('show');
      addExtraChip('Nb');
      $('comm-text').textContent=`${pOver}.${pBall} · ${bt.label} · NO BALL! Free hit incoming!`;
      // Continue to play the shot but with freehit=true
      executePlayerShot(shot,bt);
      return;
    }
  }
  executePlayerShot(shot,bt);
}

function executePlayerShot(shot,bt){
  const fl=FORM_LEVELS[formLevel];
  const pressure=calcPressure();
  // Base risk scaled by overs format
  let bW=shot.bW * oversScalar;
  // Form multiplier
  bW *= fl.wMult;
  // Bowler type multiplier
  bW *= bt.wM;
  // Each consecutive six adds escalating extra risk (more brutal for 5-over)
  if(consecutiveSixes>0){
    const perSix = matchOvers===2 ? 0.06 : 0.10;
    bW += consecutiveSixes * perSix;
  }
  // Pressure bump
  if(pressure>.5) bW += pressure*.04;
  // Free hit
  if(freehit) bW=0;
  bW=Math.min(bW,.75);

  let p=[...shot.p];
  p[4]*=fl.bBoost*bt.bdM; p[5]*=fl.bBoost*bt.bdM;
  const sum=p.reduce((a,b)=>a+b,0);
  if(sum>0){const sc=(1-bW)/sum; p=p.map(v=>Math.max(0,v*sc));}
  const isOut=bW>0&&Math.random()<bW;
  const outcome=isOut?'W':rollRuns(p);
  animateBall(outcome,'bat',()=>{applyBatOutcome(outcome,shot.label,bt);animating=false;});
}

function applyBatOutcome(outcome,shotName,bt){
  const wasFreeHit=freehit;
  freehit=false;
  $('freehit-badge').classList.remove('show');
  pBall++;
  if(outcome==='W'){
    pWkts++;resetForm();
    shakeScreen();
    wicketStreak=0;
  }else{
    pRuns+=outcome;addFormXP(outcome);if(outcome>=4)flashField(bt.id);
  }
  // Six streak
  if(outcome===6){
    sixStreak++;
    spawnParticles();
    flashBoundary(true);
    if(sixStreak===2)showStreak('🔥 Back-to-back Sixes!');
    else if(sixStreak===3)showStreak('🔥🔥🔥 Three in a Row!','#e74c3c');
    else if(sixStreak>3)showStreak(`🔥×${sixStreak}`,'#e74c3c');
  }else if(outcome===4){
    sixStreak=0;
    flashBoundary(false);
  }else{
    sixStreak=0;
  }
  // consecutiveSixes tracking
  if(outcome===6){
    consecutiveSixes++;
  } else {
    consecutiveSixes=0;
  }
  updateMomentum(outcome,true);
  $('comm-text').textContent=`${pOver}.${pBall} · ${shotName} vs ${bt.label} · ${pick(COMM[outcome==='W'?'W':outcome])}`;
  addChip(outcome);
  if(pBall>=6){pBall=0;pOver++;if(pOver<=matchOvers)$('ball-log').appendChild(makeSep());}
  updateDisplay(pRuns,pWkts,pOver,pBall);updateSituationUI();buildShotGrid();
  updateRunRate();
  if(pWkts>=MAX_WICKETS||(pOver>matchOvers&&pBall===0)){endCurrentInnings();return;}
  // Check win while chasing
  if(cpuTarget!==null&&pRuns>=cpuTarget){endMatch('player');return;}
  setShotBtns(true);
}

function endCurrentInnings(){
  if(playerBatsFirst){
    // Player just finished batting (1st innings), now player bowls
    $('mc-you').textContent=`${pRuns}/${pWkts}`;$('mc-you').className='sb-score';
    cpuTarget=pRuns+1;
    $('io-sub').textContent='Your innings is over';
    $('io-score').textContent=`You scored ${pRuns}/${pWkts}`;
    $('io-msg').textContent=`CPU needs ${cpuTarget} to win`;
    $('io-btn').textContent='Now You Bowl →';
    $('innings-overlay').classList.add('show');
  }else{
    // Player was batting 2nd (chasing CPU's score) and ran out
    endMatch('cpu_defended');
  }
}

/* ── CPU INNINGS (player bowls) ── */
function startSecondInnings(){
  $('innings-overlay').classList.remove('show');
  sixStreak=0;wicketStreak=0;momentumLog=[];
  $('pitch-area').style.background='';
  $('momentum-arrow').className='mom-neutral';
  if(playerBatsFirst){
    // CPU now bats (2nd innings)
    phase='bowling';
    resetStumps();$('ball-log').innerHTML='';
    $('sb-target').textContent=cpuTarget;$('sb-need').textContent=cpuTarget;
    $('mc-cpu').textContent='0/0';$('mc-cpu').className='sb-score active';
    $('mc-you').textContent=`${pRuns}/${pWkts}`;$('mc-you').className='sb-score';
    $('shot-grid').style.display='none';$('bowl-grid').style.display='grid';
    $('status-strip').style.display='none';
    setBanner('bowling','2nd Inn · You Bowl');
    updateDisplay(0,0,1,0);
    updateRunRate();
    $('comm-text').textContent=`CPU needs ${cpuTarget} to win. Pick your delivery!`;
    $('bowl-tag').textContent='';
    ALL_ZONES.forEach(z=>$('fd-'+z.id)?.classList.remove('on'));
  }else{
    // Player bats 2nd (chasing CPU's score)
    phase='batting';
    cpuTarget=cRuns+1;
    resetStumps();$('ball-log').innerHTML='';
    $('mc-you').textContent='batting';$('mc-you').className='sb-score active';
    $('mc-cpu').textContent=`${cRuns}/${cWkts}`;$('mc-cpu').className='sb-score';
    $('shot-grid').style.display='grid';$('bowl-grid').style.display='none';
    $('status-strip').style.display='';
    $('sb-target').textContent=cpuTarget;
    $('sb-need').textContent=cpuTarget;
    setBanner('batting','2nd Inn · You Bat');
    formXP=0;formLevel=0;dots=0;freehit=false;
    $('freehit-badge').classList.remove('show');
    updateDisplay(0,0,1,0);updateFormUI();updateSituationUI();
    updateRunRate();
    $('comm-text').textContent=`CPU scored ${cRuns}/${cWkts} — you need ${cpuTarget} to win!`;
    ALL_ZONES.forEach(z=>$('fd-'+z.id)?.classList.remove('on'));
  }
}

function endCPUFirstInnings(){
  // CPU just finished batting 1st innings, player now chases
  $('mc-cpu').textContent=`${cRuns}/${cWkts}`;$('mc-cpu').className='sb-score';
  $('io-sub').textContent="CPU's innings is over";
  $('io-score').textContent=`CPU scored ${cRuns}/${cWkts}`;
  const need=cRuns+1;
  $('io-msg').textContent=`You need ${need} to win`;
  $('io-btn').textContent='Now You Bat →';
  $('innings-overlay').classList.add('show');
}

function bowlToCPU(bt){
  if(animating||phase!=='bowling')return;
  animating=true;setBowlBtns(false);
  $('bowl-tag').textContent=`You: ${bt.label} · ${bt.desc}`;
  setField(bt.id);

  // Extras check for player bowling
  const wideChance=DELIVERY_WIDE[bt.id]||0;
  const noballChance=DELIVERY_NOBALL[bt.id]||0;
  if(Math.random()<wideChance){
    // Wide
    cRuns+=1;
    $('comm-text').textContent=`${cOver}.${cBall} · ${bt.label} · WIDE — strays off!`;
    addExtraChip('Wd');
    $('mc-cpu').textContent=`${cRuns}/${cWkts}`;
    updateDisplay(cRuns,cWkts,cOver,cBall);
    updateRunRate();
    if(cpuTarget&&cRuns>=cpuTarget){endMatch('cpu');return;}
    animating=false;
    setBowlBtns(true);
    return;
  }
  if(Math.random()<noballChance){
    // No-ball to CPU — +1 CPU run, CPU gets free hit next ball
    cRuns+=1;
    cpuFreehit=true;
    addExtraChip('Nb');
    $('bowl-tag').textContent=`You: ${bt.label} · ${bt.desc} — CPU FREE HIT`;
    $('comm-text').textContent=`${cOver}.${cBall} · ${bt.label} · NO BALL! CPU gets a free hit!`;
    $('mc-cpu').textContent=`${cRuns}/${cWkts}`;
    updateDisplay(cRuns,cWkts,cOver,cBall);
    updateRunRate();
    if(cpuTarget&&cRuns>=cpuTarget){endMatch('cpu');return;}
    // Fall through to normal delivery (ball not counted)
    executeCPUBall(bt,true);
    return;
  }
  executeCPUBall(bt,false);
}

function executeCPUBall(bt,isNoball){
  const isFreeHit=cpuFreehit&&!isNoball;
  if(isFreeHit)cpuFreehit=false;

  // CPU picks a shot based on match situation
  const ballsLeft=(matchOvers-cOver)*6+(6-cBall);
  const chasing=cpuTarget!==null;
  const deficit=chasing?Math.max(0,cpuTarget-cRuns):0;
  const rrRequired=ballsLeft>0?deficit/(ballsLeft/6):0;
  // Under pressure CPU goes for more attacking shot
  let shotIdx;
  if(rrRequired>12||(!chasing&&ballsLeft<=6)) shotIdx=3;       // Six
  else if(rrRequired>8||(!chasing&&ballsLeft<=12)) shotIdx=2;  // Four
  else if(rrRequired>5) shotIdx=Math.random()<.5?2:1;          // Four/Drive mix
  else shotIdx=Math.random()<.6?1:0;                           // Drive/Block mix

  const cpuShot=SHOTS[shotIdx];
  let w=cpuShot.bW*oversScalar*bt.wM;
  if(cpuConsecutiveSixes>0){
    const perSix=matchOvers===2?0.06:0.10;
    w+=cpuConsecutiveSixes*perSix;
  }
  if(isFreeHit) w=0;
  w=Math.min(w,.75);

  let p=[...cpuShot.p];
  p[4]*=bt.bdM; p[5]*=bt.bdM;
  const s=p.reduce((a,b)=>a+b,0);
  if(s>0){const sc=(1-w)/s;p=p.map(v=>Math.max(0,v*sc));}
  const isOut=w>0&&Math.random()<w;
  const outcome=isOut?'W':rollRuns(p);
  const btName=bt.label;
  if(isNoball){
    // Ball not counted in over — just resolve and re-enable
    if(outcome!=='W')cRuns+=outcome;
    const ca=COMM[outcome==='W'?'cW':outcome===0?'c0':outcome]||COMM.c0;
    $('comm-text').textContent=`${cOver}.${cBall} · CPU vs ${btName} · ${pick(ca)}`;
    addChip(outcome==='W'?0:outcome);// no-ball W doesn't count
    $('mc-cpu').textContent=`${cRuns}/${cWkts}`;
    updateDisplay(cRuns,cWkts,cOver,cBall);
    updateRunRate();
    if(cpuTarget&&cRuns>=cpuTarget){endMatch('cpu');return;}
    animating=false;
    setBowlBtns(true);
    return;
  }
  animateBall(outcome,'bowl',()=>{applyCPUOutcome(outcome,btName,isFreeHit);animating=false;});
}

function applyCPUOutcome(outcome,btName,wasFreeHit){
  cBall++;
  const ca=COMM[outcome==='W'?'cW':outcome===0?'c0':outcome]||COMM.c0;
  $('comm-text').textContent=`${cOver}.${cBall} · CPU vs ${btName} · ${pick(ca)}`;
  addChip(outcome);
  if(outcome==='W'){
    cWkts++;
    cpuConsecutiveSixes=0;
    shakeScreen();
    wicketStreak++;
    if(wicketStreak===2)showStreak('⚡ Double Strike!','#5dade2');
    else if(wicketStreak===3)showStreak('🎯 Hat-trick Alert!','#e74c3c');
  }else{
    cRuns+=outcome;
    if(outcome===6){cpuConsecutiveSixes++;flashBoundary(true);}
    else{cpuConsecutiveSixes=0;if(outcome===4)flashBoundary(false);}
  }
  updateMomentum(outcome,false);
  if(cBall>=6){cBall=0;cOver++;if(cOver<=matchOvers)$('ball-log').appendChild(makeSep());}
  const need=cpuTarget?Math.max(0,cpuTarget-cRuns):null;
  if(need!==null)$('sb-need').textContent=need||'WON';
  $('mc-cpu').textContent=`${cRuns}/${cWkts}`;
  updateDisplay(cRuns,cWkts,cOver,cBall);
  updateRunRate();
  if(cpuTarget&&cRuns>=cpuTarget){endMatch('cpu');return;}
  if(cWkts>=MAX_WICKETS||(cOver>matchOvers&&cBall===0)){
    if(playerBatsFirst){
      endMatch('player');
    }else{
      // CPU was batting 1st and is done
      endCPUFirstInnings();
    }
    return;
  }
  setBowlBtns(true);
}

// MATCH END
function endMatch(winner){
  phase='end';$('gameover').classList.add('show');
  const gt=$('go-title'),gs=$('go-scores'),gd=$('go-detail');
  if(winner==='player'){
    gt.textContent='You Win!';gt.className='ov-title';
    gs.textContent=`CPU ${cRuns}/${cWkts} — won by ${(cpuTarget-1)-cRuns} runs`;
  }else if(winner==='cpu_defended'){
    gt.textContent='CPU Wins';gt.className='ov-title loss';
    gs.textContent=`You needed ${cpuTarget} — fell short`;
  }else{
    gt.textContent='CPU Wins';gt.className='ov-title loss';
    gs.textContent=`CPU reached ${cpuTarget} — ${MAX_WICKETS-cWkts} wickets to spare`;
  }
  if(playerBatsFirst){
    gd.textContent=`You: ${pRuns}/${pWkts} · CPU: ${cRuns}/${cWkts}`;
  }else{
    gd.textContent=`CPU: ${cRuns}/${cWkts} · You: ${pRuns}/${pWkts}`;
  }
}

// ANIMATION
function animateBall(outcome,dir,cb){
  const pa=$('pitch-area'),paR=pa.getBoundingClientRect();
  const ps=$('pitch-strip'),psR=ps.getBoundingClientRect();
  const cx=psR.left-paR.left+psR.width/2-8;
  const startY=dir==='bat'?20:paR.height-46;
  const endY  =dir==='bat'?paR.height-46:20;
  const be=$('ball-el'),bat=$('bat-el');

  be.style.cssText=`display:block;left:${cx}px;top:${startY}px;transition:none;opacity:1;`;
  if(dir==='bat') bat.classList.add('swing');

  /* bowl straight down pitch */
  setTimeout(()=>{
    be.style.transition='left .32s linear,top .32s linear';
    be.style.top=endY+'px';
  },30);

  setTimeout(()=>{
    bat.classList.remove('swing');

    if(outcome==='W'){
      (dir==='bat'?['st-b1','st-b2','st-b3']:['st-w1','st-w2','st-w3'])
        .forEach(id=>$(id)?.classList.add('fallen'));
      be.style.transition='opacity .25s';
      be.style.opacity='0';

    } else if(outcome>0){
      const isBoundary=outcome>=4;
      /* random direction: boundaries go further, runs stay short */
      const ang=(Math.random()*140-70)*Math.PI/180;
      const dist=isBoundary?(outcome===6?paR.height*0.9:paR.height*0.7):40+outcome*20;
      const speed=isBoundary?(outcome===6?.55:.45):.38;
      be.style.transition=`left ${speed}s linear,top ${speed}s linear,opacity ${speed}s`;
      be.style.left =(cx +Math.sin(ang)*dist)+'px';
      be.style.top  =(endY-Math.cos(ang)*dist*0.6)+'px';
      be.style.opacity=isBoundary?'0':'0';
    } else {
      be.style.transition='opacity .2s';
      be.style.opacity='0';
    }

    const pop=$('shot-pop');
    pop.textContent=outcome==='W'?'OUT!':outcome===0?'·':outcome===6?'SIX!':outcome===4?'FOUR!':`${outcome}`;
    pop.style.color=outcome==='W'?'#e74c3c':outcome>=4?'#f0c040':'rgba(255,255,255,.8)';
    pop.classList.add('show');

    const wait=outcome===6?600:outcome===4?500:400;
    setTimeout(()=>{
      pop.classList.remove('show');
      be.style.display='none';
      be.style.opacity='1';
      cb();
    },wait+400);
  },340);
}

function updateDisplay(r,w,ov,bl){
  $('sb-runs').textContent=r;$('sb-wkts').textContent=w;
  $('sb-over').textContent=Math.min(ov,matchOvers||5);$('sb-ball').textContent=bl;
  const left=(matchOvers||5)-(ov-1);$('sb-left').textContent=`${Math.max(0,left)} left`;
}
function addChip(outcome){const v=outcome==='W'?'W':outcome;const d=document.createElement('div');d.className=`bc bc-${v}`;d.textContent=v;$('ball-log').appendChild(d);}
function makeSep(){const d=document.createElement('div');d.className='bc bc-sep';return d;}
function resetStumps(){document.querySelectorAll('.stump').forEach(s=>s.classList.remove('fallen'));}
function setBanner(cls,txt){const b=$('phase-banner');b.className=`phase-banner ${cls}`;b.textContent=txt;}

/* ── VISUAL DRAMA STATE ── */
let sixStreak=0,wicketStreak=0,momentumLog=[];

/* ── PARTICLE BURST ── */
function spawnParticles(){
  const pa=$('pitch-area');
  const paW=pa.offsetWidth,paH=pa.offsetHeight;
  const cx=paW/2,cy=paH*0.65;
  const colors=['#f0c040','#e74c3c','#5dade2','#58d68d','#e67e22','#fff'];
  for(let i=0;i<22;i++){
    const el=document.createElement('div');
    el.className='particle';
    const size=5+Math.random()*5;
    const dx=(Math.random()*240-120)+'px';
    const dy=(Math.random()*240-120)+'px';
    const col=colors[Math.floor(Math.random()*colors.length)];
    el.style.cssText=`width:${size}px;height:${size}px;background:${col};left:${cx-size/2}px;top:${cy-size/2}px;--dx:${dx};--dy:${dy};`;
    pa.appendChild(el);
    setTimeout(()=>el.remove(),900);
  }
}

/* ── SCREEN SHAKE ── */
function shakeScreen(){
  const app=$('app');
  app.classList.remove('shake');
  void app.offsetWidth;
  app.classList.add('shake');
}

/* ── PITCH MOOD ── */
function updatePitchMood(pressure){
  const r=Math.round(45+pressure*(100-45));
  const g=Math.round(90+pressure*(28-90));
  const b=Math.round(39+pressure*(18-39));
  $('pitch-area').style.background=`rgb(${r},${g},${b})`;
}

/* ── BOUNDARY FLASH ── */
function flashBoundary(isSix){
  const pa=$('pitch-area');
  pa.classList.remove('flash-four','flash-six');
  void pa.offsetWidth;
  pa.classList.add(isSix?'flash-six':'flash-four');
  setTimeout(()=>pa.classList.remove('flash-four','flash-six'),isSix?700:600);
}

/* ── STREAK BANNER ── */
function showStreak(text,color){
  const el=$('streak-banner');
  el.textContent=text;
  el.style.color=color||'#f0c040';
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

/* ── MOMENTUM ARROW ── */
function updateMomentum(outcome,playerScored){
  let val;
  if(outcome==='W'){val=playerScored?-3:3;}
  else{val=playerScored?outcome:-outcome;}
  momentumLog.push(val);
  if(momentumLog.length>5)momentumLog.shift();
  const sum=momentumLog.reduce((a,b)=>a+b,0);
  const arrow=$('momentum-arrow');
  if(sum>1){arrow.className='mom-you';}
  else if(sum<-1){arrow.className='mom-cpu';}
  else{arrow.className='mom-neutral';}
}

initGame();
</script>
